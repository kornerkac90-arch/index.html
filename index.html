    border: 4px solid var(--accent-gold); /* Zadržavamo zlatni okvir */
}


header h1 {
    margin: 0;

    font-size: 20px; /* Prilagodi ako želiš veće/manje */

        :root {
            --blue-gradient: linear-gradient(135deg, #1e3a8a, #3b82f6);
            --bg-body: #0f172a;
            --text-color: #ffffff;
            --accent-gold: #fbbf24;
        }

/* Body zauzima celu visinu ekrana i sprečava skrol cele stranice */
body { 
    font-family: 'Segoe UI', sans-serif; 
    background: radial-gradient(circle at center, #1e293b, #0f172a); 
    color: var(--text-color); 
    margin: 0; 
    padding: 5px; 
    overflow: hidden; /* OVO JE KLJUČNO - onemogućava skrol cele stranice */
    height: 100vh; 
    display: flex;
    flex-direction: column;
}
.grid-container { 
    display: grid; 
    gap: 10px; 
    grid-template-columns: 1fr 1fr 1fr; 
    /* Prvi i drugi red se dele, treći red (zanimljivosti) dobija minimalno potreban prostor */
    grid-template-rows: 1fr 1fr auto(60px, 0.2fr); 
    flex-grow: 1; 
    width: 100%;
    height: calc(100vh - 90px); /* Smanji broj ako je header veći */
    box-sizing: border-box;
    padding: 5px;
}
.box { 
    /* Pozadina */
    background: #0f172a; /* Boja unutrašnjosti */
    
    /* Ovo pravi zaobljenu ivicu sa neon prelivom */
    border: 3px solid transparent;
    border-radius: 20px;
    background-image: linear-gradient(#0f172a, #0f172a), 
                      linear-gradient(135deg, #3b82f6, #ef4444, #22c55e, #fbbf24);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    
    /* Dodatni neon sjaj */
    box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    
    padding: 10px; 
    color: white; 
    display: flex; 
    flex-direction: column;
    overflow: hidden; 
    position: relative;
    box-sizing: border-box;
}

/* OVO JE KLJUČNO: Oštra unutrašnjost */
.box table, 
.box .match-card, 
.box .p-box, 
.box .long-term-item, 
.box .h2h-item {
    border-radius: 0 !important;
}


.box::after {
    content: "";
    position: absolute;
    bottom: 5px;
    right: 5px;
    width: 40px; 
    height: 40px;
    background-image: url('https://upload.wikimedia.org/wikipedia/commons/e/ec/FIFA_World_Cup_2026_Logo.png');
    background-size: contain;
    background-repeat: no-repeat;
    opacity: 0.2; /* Malo providno da ne smeta tekstu */
    pointer-events: none;
}
/* Osigurava da unutrašnji sadržaj ima skrol ako je dugačak */
.box > div:not(h2) { 
    overflow-y: auto; 
    flex-grow: 1; 
    scrollbar-width: thin; 
}

 h2 { 
    margin: 0 0 10px 0; 
    font-size: 12px; 
    color: var(--accent-gold); 
    border-bottom: 2px solid var(--accent-gold); 
    padding-bottom: 5px; 
    text-transform: uppercase; 
}   
        /* Centriranje podataka u tabeli */
        table { width:100%; border-collapse: collapse; color: white; table-layout: fixed; } /* table-layout: fixed sprečava širenje tabele */
        table td, table th { text-align: center; overflow: hidden; text-overflow: ellipsis; }
        table th:first-child, table td:first-child { text-align: left; }
        
        .tabela { grid-column: 2; grid-row: 1; }
        .h2h { grid-column: 2; grid-row: 2; }
        .dnevne { grid-column: 1; grid-row: 1 / 3; }
        .dugorocne { grid-column: 3; grid-row: 1; }
        .istorija { grid-column: 3; grid-row: 2; }
        .zanimljivosti { grid-column: 1 / 4; grid-row: 3; }

        .match-card { background: rgba(255,255,255,0.05); padding: 6px; border-radius: 4px; margin-bottom: 10px; }

async function azurirajRezultate() {
    // 1. Provera vremena
    const sat = new Date().getHours();
    if (!(sat >= 19 || sat < 7)) return;

    // 2. Provera da li u TRENUTNO_KOLO ima aktivnih mečeva

    const apiKey = 'f0795ca90e468fc87e6d98cde0f477d7'; 
    const url = 'https://api-football-v1.p.rapidapi.com/v3/fixtures?live=all';

    try {
        const response = await fetch(url, {
            headers: { 'X-RapidAPI-Key': apiKey, 'X-RapidAPI-Host': 'api-football-v1.p.rapidapi.com' }
        });
        const data = await response.json();

        data.response.forEach(match => {
            const hName = match.teams.home.name;
            const homeG = match.goals.home;
            const awayG = match.goals.away;

            // Prolazimo SAMO kroz TRENUTNO_KOLO

                    }
                }
            });
        });
        renderUI(); // Osvazi tabelu
    } catch (e) { console.error("API Error:", e); }
}
